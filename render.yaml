# Render Blueprint - Report Viewer as a static site (free, never sleeps, served from Render's CDN).
# The viewer runs completely in the browser: your application sends the report text and its rows (viewer.js).
#
# Deploy: in Render choose New > Blueprint (or New > Static Site) and pick this repository.
#   viewer:     https://<service>.onrender.com/
#   helper:     https://<service>.onrender.com/viewer.js
#
# Any site may show the viewer in an iframe (it holds no data of its own). To allow only your systems, add a header
#   - path: /*
#     name: Content-Security-Policy
#     value: "frame-ancestors 'self' https://erp.example.com"

services:
  - type: web
    runtime: static
    name: report-viewer
    # --include=dev: the build needs vite / vue-tsc from devDependencies
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # fixed names: browsers check for a new version on every load
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /viewer.html
        name: Cache-Control
        value: no-cache
      - path: /viewer.js
        name: Cache-Control
        value: no-cache
      # Vite puts a content hash in these file names, so they can be cached forever
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
